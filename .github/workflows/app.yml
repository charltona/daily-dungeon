name: Application CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '*.*.*'
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to deploy / rollback to (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  verify-and-build:
    name: Verify & Build Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: daily_dungeon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Shared Unit Tests
        run: npm test --workspace=@daily-dungeon/shared

      - name: Build Monorepo (Shared, Server, Client)
        run: npm run build

      - name: Verify Database Connectivity & Apply Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/daily_dungeon_test
        run: |
          npm run db:check --workspace=@daily-dungeon/server
          npm run db:migrate --workspace=@daily-dungeon/server

      - name: Build Production Docker Image
        run: docker build -t daily-dungeon:test .

  deploy-app:
    name: Build, Push & Deploy to ECS
    runs-on: ubuntu-latest
    needs: verify-and-build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/DailyDungeonGitHubDeployRole
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Application Container Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: daily-dungeon-app
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DEPLOY_TAG=$(echo "$RAW_TAG" | sed -e 's#^refs/tags/##' -e 's#^refs/heads/##')
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Building container image for tag: $DEPLOY_TAG (commit: $COMMIT_SHA)"

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$DEPLOY_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$DEPLOY_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$DEPLOY_TAG" >> $GITHUB_OUTPUT

      - name: Discover ECS Cluster and Service
        id: fetch-ecs
        env:
          CLUSTER_NAME: daily-dungeon-cluster
        run: |
          SERVICE_NAME=$(aws ecs list-services --cluster $CLUSTER_NAME --query "serviceArns[?contains(@, 'DailyDungeonService')]" --output text | awk -F'/' '{print $NF}')
          if [ -z "$SERVICE_NAME" ] || [ "$SERVICE_NAME" = "None" ]; then
            SERVICE_NAME=$(aws ecs list-services --cluster $CLUSTER_NAME --query "serviceArns[0]" --output text | awk -F'/' '{print $NF}')
          fi
          echo "Discovered ECS Service: $SERVICE_NAME"
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT

          TASK_DEF_ARN=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].taskDefinition" --output text)
          echo "Discovered Active Task Definition: $TASK_DEF_ARN"
          aws ecs describe-task-definition --task-definition $TASK_DEF_ARN --query taskDefinition > task-definition.json

      - name: Render New Container Image into ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: web
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Updated Task Definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.fetch-ecs.outputs.service_name }}
          cluster: daily-dungeon-cluster
          wait-for-service-stability: true

