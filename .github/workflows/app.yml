name: Application CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify & Build Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: daily_dungeon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Shared Unit Tests
        run: npm test --workspace=@daily-dungeon/shared

      - name: Build Monorepo (Shared, Server, Client)
        run: npm run build

      - name: Verify Database Connectivity & Apply Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/daily_dungeon_test
        run: |
          npm run db:check --workspace=@daily-dungeon/server
          npm run db:migrate --workspace=@daily-dungeon/server

      - name: Build Production Docker Image
        run: docker build -t daily-dungeon:test .
