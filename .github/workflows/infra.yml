name: Infrastructure CI

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

jobs:
  verify-infra:
    name: Verify & Synthesize Infrastructure
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'infra/package-lock.json'

      - name: Install Infra Dependencies
        run: npm ci

      - name: Configure AWS Credentials via OIDC
        if: ${{ secrets.AWS_ACCOUNT != '' && secrets.AWS_REGION != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/DailyDungeonGitHubDeployRole
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run Infra Unit Tests
        run: npm test

      - name: Synthesize AWS CDK CloudFormation Stack
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT || '123456789012' }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: npx cdk synth

  deploy-infra:
    name: Deploy Infrastructure Stack
    runs-on: ubuntu-latest
    needs: verify-infra
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'infra/package-lock.json'

      - name: Install Infra Dependencies
        run: npm ci

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/DailyDungeonGitHubDeployRole
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy CDK Stack
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: npx cdk deploy --require-approval never

